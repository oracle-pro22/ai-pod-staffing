[project]
name = "ai-pod-staffing-backend"
version = "0.5.0"
description = "AI POD Staffing Python backend — two-agent proposal workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "tzdata>=2025.1",
  "oracledb>=3,<5",
  "oci>=2.150,<3",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "langchain-oci>=0.1,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
